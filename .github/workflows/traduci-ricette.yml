name: Traduci ricette (AchRecipes, inglese)
# 20/11/2026 (Stefano, «strada mista»): traduce in inglese procedimenti, storie e varianti di AchRecipes con un traduttore
# libero e gratuito (Opus-MT, Università di Helsinki), che da claude.ai non si scarica. Programma nel privato
# (achrecipes/strumenti/traduci_auto.py), risultato nel privato (achrecipes/en/testi_auto.json): la chat di Recipes lo
# controlla e lo corregge prima di pubblicare. Traduce solo le frasi nuove: si rilancia quando arrivano ricette nuove.
# Nel registro pubblico solo conteggi.
on:
  workflow_dispatch:
    inputs:
      minuti:
        description: 'Minuti al massimo di traduzione (poi salva; il giro dopo riparte da dove è arrivato)'
        default: '300'
permissions:
  contents: read
concurrency:
  group: traduci-ricette
  cancel-in-progress: false
jobs:
  traduci:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Repository privato (programma e frasi)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ristoranti-archivio
          token: ${{ secrets.PRIVATO_TOKEN }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /achrecipes/strumenti/
            /achrecipes/en/
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Modello già scaricato nei giri prima
        uses: actions/cache@v4
        with: { path: ~/ct2, key: opus-mt-it-en-ct2-1 }
      - name: Programmi e modello
        run: |
          pip install --quiet ctranslate2 transformers sentencepiece sacremoses
          if [ ! -f ~/ct2/model.bin ]; then
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            for m in Helsinki-NLP/opus-mt-tc-big-it-en Helsinki-NLP/opus-mt-it-en; do
              rm -rf ~/ct2
              if ct2-transformers-converter --model "$m" --output_dir ~/ct2 --quantization int8 > /dev/null 2>&1; then echo "$m" > ~/ct2/MODELLO; break; fi
            done
          fi
          test -f ~/ct2/model.bin || { echo "modello non scaricato"; exit 1; }
          echo "modello: $(cat ~/ct2/MODELLO)"
          echo "MODELLO=$(cat ~/ct2/MODELLO)" >> "$GITHUB_ENV"
      - name: Traduce
        env:
          MINUTI: ${{ github.event.inputs.minuti }}
        run: |
          m=$(echo "$MINUTI" | tr -cd '0-9'); [ -z "$m" ] && m=300; [ "$m" -gt 320 ] && m=320
          CT2_DIR=~/ct2 python3 achrecipes/strumenti/traduci_auto.py --traduci --minuti "$m" --modello "$MODELLO"
      - name: Salva nel repository privato
        if: always()
        run: |
          set +e
          git config user.name "ach-officina"; git config user.email "actions@users.noreply.github.com"
          git add --sparse achrecipes/en/testi_auto.json achrecipes/en/da_tradurre.json
          git commit -qm "AchRecipes: traduzione automatica dei testi in inglese (officina)" > /dev/null || { echo "nessuna modifica"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q --no-edit > /dev/null 2>&1 && git push -q > /dev/null 2>&1 && { echo "salvato al tentativo $i"; exit 0; }
            git rebase --abort > /dev/null 2>&1 || true; sleep $((RANDOM % 15 + 5))
          done; echo "non salvato"; exit 1
