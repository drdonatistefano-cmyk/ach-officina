name: Sala chiusa
# 20/11/2026 (Stefano: «costruire qualcosa per ovviare ai consumi GitHub»). Un lavoro del repository privato eseguito
# qui, dove i minuti sono gratuiti, «a porte chiuse»: il lavoro si sceglie per NOME da un elenco chiuso che sta nel
# privato (strumenti/sala_chiusa.json), tutto quello che scrive finisce in un file del privato
# (contatti/sala-chiusa/NOME.log) e in questo registro pubblico escono solo conteggi: esito, secondi, righe, file
# cambiati. Alla fine si salvano nel privato solo le cartelle dichiarate per quel lavoro.
# Da una chat: gh workflow run sala-chiusa.yml -R <account>/ach-officina (account: progetto.json del privato) -f lavoro=prova
# 23/11/2026 (Stefano: «autorizzo l'uso dell'officina purché venga utilizzata senza compromettere altri lavori e che sia
# gratis»): ogni ora parte il lavoro «coda», che fa uno solo dei lavori chiesti dalle chat (contatti/sala-chiusa/richieste.txt
# nel privato, strumenti/sala_chiusa.py --chiedi) e lo toglie dalla coda; a coda vuota finisce in pochi secondi. Gratis:
# repository pubblico. Mai due giri della coda insieme (concurrency qui sotto); la posta non passa mai dalla coda.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lavoro:
        description: 'Nome del lavoro (elenco: strumenti/sala_chiusa.json nel privato). Solo lettere minuscole, cifre e trattini.'
        default: 'prova'
permissions:
  contents: read
# 23/11/2026 (Stefano: sì): i lavori della posta (posta-…) vanno uno alla volta, mai due insieme (niente risposte doppie)
concurrency: { group: "sala-chiusa-${{ startsWith(github.event.inputs.lavoro, 'posta') && 'posta' || github.event.inputs.lavoro || (github.event_name == 'schedule' && 'coda') || 'prova' }}", cancel-in-progress: false }
jobs:
  sala:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LAVORO: ${{ github.event.inputs.lavoro || (github.event_name == 'schedule' && 'coda') || 'prova' }}
    steps:
      # 26/11/2026 (Stefano 25/11 16:12, passo 1): il giro orario guarda prima la coda con una copia leggera (pochi secondi);
      # se è vuota finisce lì, senza scaricare tutto il privato. Ogni altro caso va esattamente come prima.
      - name: Coda vuota? (copia leggera)
        id: coda
        if: env.LAVORO == 'coda'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ristoranti-archivio
          token: ${{ secrets.PRIVATO_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            strumenti
            contatti/sala-chiusa
          path: leggera
      - name: Coda vuota? (risposta)
        id: vuota
        if: env.LAVORO == 'coda'
        run: echo "stato=$(cd leggera && python3 strumenti/sala_chiusa.py --coda-vuota | tr -cd 'a-z')" >> "$GITHUB_OUTPUT"
      - name: Coda vuota, niente da fare
        if: steps.vuota.outputs.stato == 'vuota'
        run: echo "sala chiusa, coda vuota (copia leggera, nessuno scaricamento del privato)"
      - name: Repository privato (programmi e dati)
        if: steps.vuota.outputs.stato != 'vuota'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ristoranti-archivio
          token: ${{ secrets.PRIVATO_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        if: steps.vuota.outputs.stato != 'vuota'
        with: { python-version: '3.12' }
      - name: Prove della sala chiusa (dallo schermo non deve passare nulla)
        if: steps.vuota.outputs.stato != 'vuota'
        run: python3 strumenti/prove_sala_chiusa.py | tail -n 1
      - name: Quale lavoro, e con quali chiavi
        id: q
        if: steps.vuota.outputs.stato != 'vuota'
        run: |
          l=$(printf '%s' "$LAVORO" | tr -cd 'a-z0-9-' | cut -c1-41)
          s=$(python3 strumenti/sala_chiusa.py --segreti "$l" | tr -cd 'a-z' | cut -c1-12)
          echo "lavoro=$l" >> "$GITHUB_OUTPUT"; echo "segreti=$s" >> "$GITHUB_OUTPUT"
      - name: Il lavoro, a porte chiuse (senza chiavi)
        if: steps.vuota.outputs.stato != 'vuota' && steps.q.outputs.segreti == ''
        env: { L: "${{ steps.q.outputs.lavoro }}" }
        run: |
          set -o pipefail
          python3 strumenti/sala_chiusa.py "$L" --salva 2>/dev/null | tail -n 3 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[link]#g'
      - name: Il lavoro, a porte chiuse (con le chiavi della casella di posta)
        if: steps.vuota.outputs.stato != 'vuota' && steps.q.outputs.segreti == 'posta'
        env:
          L: ${{ steps.q.outputs.lavoro }}
          POSTA_UTENTE: ${{ secrets.POSTA_UTENTE }}
          POSTA_PASSWORD: ${{ secrets.POSTA_PASSWORD }}
          POSTA_SEGRETO: ${{ secrets.POSTA_SEGRETO }}
          # 22/11/2026: per contare i minuti del privato e i giri andati male nel giro della sera (STATO.md)
          PRIVATO_TOKEN: ${{ secrets.PRIVATO_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$POSTA_UTENTE" ] || [ -z "$POSTA_PASSWORD" ]; then echo "sala chiusa: chiavi della posta non ancora messe nell'officina"; exit 2; fi
          python3 strumenti/sala_chiusa.py "$L" --salva 2>/dev/null | tail -n 3 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[link]#g'
