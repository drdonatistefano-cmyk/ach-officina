name: Email dai siti ufficiali (locali di Events, ristoranti di Dinners)
# 18/11/2026: stesso lavoro del flusso «Email dai siti ufficiali» del repository privato (strumenti/raccolta_siti.py),
# qui con i minuti gratuiti. Programmi e risultati restano nel privato (PRIVATO_TOKEN); nel registro solo conteggi.
# Ogni mattina prima dell'invio delle lettere; nessuna email viene inviata.
on:
  schedule:
    - cron: '52 9 * * *'   # 10:52 di Roma
  workflow_dispatch:
    inputs:
      limite:
        description: "Quanti siti leggere al massimo (vuoto = tutti quelli nuovi)"
        required: false
        default: ""
permissions:
  contents: read
concurrency: { group: email-siti, cancel-in-progress: false }
jobs:
  leggi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repository privato (programmi e risultati)
        uses: actions/checkout@v4
        with:
          repository: drdonatistefano-cmyk/ristoranti-archivio
          token: ${{ secrets.PRIVATO_TOKEN }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /strumenti/
            /posta/
            /contatti/raccolta/
            /contatti/elenchi/siti-osm.csv
            /contatti/overture/overture_BO.csv
            /contatti/overture/overture_MI.csv
            /contatti/eventi-locali-lotto1.csv
            /contatti/invii.csv
            /contatti/soggetti/soggetti.csv
            /contatti/soggetti/siti-trovati.csv
            /contatti/soggetti/email-soggetti.csv
            /contatti/estero/
      - name: Programma di Events (repository pubblico)
        uses: actions/checkout@v4
        with: { repository: drdonatistefano-cmyk/eventi-bologna, path: _events, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Chromium già scaricato nei giri prima (circa un minuto in meno a giro)
        uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: chromium-1 }
      - run: pip install -q requests pypdf beautifulsoup4 lxml playwright && python3 -m playwright install --with-deps chromium > /dev/null 2>&1   # 19/11: Chromium per i siti in JavaScript
      - name: Locali di Events e loro siti
        run: python3 strumenti/raccolta_coda_bo_mi.py _events > /tmp/coda.log 2>&1; tail -n 2 /tmp/coda.log | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[sito]#g'
      - name: Legge i siti nuovi (al massimo 80 minuti, più 20 per i siti in JavaScript; i non letti restano per il giro dopo)
        env: { MAX_MINUTI: '80', BROWSER_MINUTI: '20' }
        run: |
          python3 strumenti/raccolta_siti.py ${{ github.event.inputs.limite && format('--limite {0}', github.event.inputs.limite) || '' }} > /tmp/siti.log 2>&1 || true
          grep -E "da leggere|letti|restano|JavaScript" /tmp/siti.log | tail -n 5 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[sito]#g'
      - name: Elenco della lettera ai locali di Events
        run: python3 strumenti/events_elenco.py > /dev/null 2>&1 || echo "elenco non rifatto"
      - name: Elenchi delle lettere estere (le email trovate sui siti esteri entrano nelle lettere)
        run: python3 strumenti/estero_elenchi.py 2>&1 | grep -E "indirizzi" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[sito]#g' || echo "elenchi esteri non rifatti"
      - name: Salva nel repository privato
        run: |
          set +e
          rm -rf _events
          git config user.name "ach-officina"; git config user.email "actions@users.noreply.github.com"
          git add --sparse contatti/raccolta contatti/eventi-locali-lotto1.csv contatti/estero
          git commit -qm "Email dai siti ufficiali e elenco Events (officina): $(date +%F)" > /dev/null || { echo "nessuna modifica"; exit 0; }
          rm -rf /tmp/nostra && cp -r contatti/raccolta /tmp/nostra
          for i in 1 2 3 4 5; do
            git pull --rebase -q --no-edit > /dev/null 2>&1 && git push -q > /dev/null 2>&1 && { echo "salvato al tentativo $i"; exit 0; }
            git rebase --abort > /dev/null 2>&1
            git fetch -q origin main && git reset -q --hard origin/main
            python3 strumenti/unisci_raccolta.py /tmp/nostra > /dev/null 2>&1 && python3 strumenti/events_elenco.py > /dev/null 2>&1; python3 strumenti/estero_elenchi.py > /dev/null 2>&1
            git add --sparse contatti/raccolta contatti/eventi-locali-lotto1.csv contatti/estero
            git commit -qm "Email dai siti ufficiali e elenco Events (officina): $(date +%F) (unito a main)" > /dev/null || exit 0
            sleep $((RANDOM % 10 + 5))
          done; echo "non salvato"; exit 1
