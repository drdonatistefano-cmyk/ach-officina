name: Notte (prove e controlli del progetto)
# 25/11/2026, Stefano alla chat di coordinamento: «auto-manutenzione», «auto-riparazione», «le chat velocissime».
# Ogni notte alle 3:23 di Roma (fuori dai giri della posta): lavoro «prove-notte» della sala chiusa = tutte le prove del
# privato + cronometro dell'avvio di ogni chat (strumenti/notte_prove.py). Salva solo contatti/prove-notte/ nel privato.
# Legge solo i file del privato: niente rete, niente posta. Qui escono solo conteggi.
on:
  schedule:
    - cron: "23 2 * * *"
    # 27/11/2026 (Stefano: «fai in modo che non accada più»): anche alle 13:23 di Roma, così una prova corretta in mattinata
    # non resta rossa sulla pagina Cobra fino alla notte dopo (subito: strumenti/rimisura.py prove nel privato).
    # La missione del mercoledì gira solo con il giro della notte (vedi sotto).
    - cron: "23 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: "sala-chiusa-notte", cancel-in-progress: false }
jobs:
  notte:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Repository privato (programmi e dati)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ristoranti-archivio
          token: ${{ secrets.PRIVATO_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Programmi che servono alle prove
        run: pip install -q -r requirements.txt 2>/dev/null | tail -n 1 || true
      - name: Prove di tutto il progetto e cronometro delle chat, a porte chiuse
        run: |
          set -o pipefail
          python3 strumenti/sala_chiusa.py prove-notte --salva 2>/dev/null | tail -n 3 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[link]#g'
      # 25/11/2026 (Stefano 14:53: «Sì mercoledì»): ogni mercoledì notte la missione «recipes» di Cobra (Pro Loco, sagre,
      # Presìdi, prima i comuni con più luoghi in Places), così il giro di Dishes del giovedì notte trova fonti nuove.
      # Non è una raccolta di email: legge solo pagine pubbliche e scrive proposte in contatti/cobra/recipes/ del privato.
      - name: Il mercoledì, fonti nuove per le ricette (Cobra, missione recipes)
        continue-on-error: true
        timeout-minutes: 65
        run: |
          [ "$(TZ=Europe/Rome date +%u)" = "3" ] || { echo "non è mercoledì: niente missione recipes"; exit 0; }
          [ "$(TZ=Europe/Rome date +%H)" -lt 6 ] || { echo "giro del pomeriggio: la missione recipes resta alla notte"; exit 0; }
          python3 strumenti/sala_chiusa.py cobra-recipes --salva 2>/dev/null | tail -n 3 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[link]#g'
