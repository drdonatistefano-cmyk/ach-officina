name: Affidabilità delle caselle
# 19/11/2026 (Stefano): gratis non si può chiedere al server se una casella esiste (porta 25 chiusa su GitHub e
# Cloudflare). Al suo posto, per ogni casella in coda e per quelle già scritte: il sito del suo dominio è vivo, morto o
# in vendita? l'indirizzo è ancora scritto oggi sul sito? la scheda di OpenStreetMap ce l'ha ancora? Poi misura quanto
# tornano indietro le lettere per ogni prova (contatti/caselle/RIEPILOGO.md e regole.json: il controllo delle lettere
# ferma solo i gruppi che tornano almeno 1 volta su 5) e cerca la casella nuova dello stesso ente per le lettere
# tornate indietro (contatti/caselle/sostituti.csv). Programmi nel privato (strumenti/caselle.py); nessuna email
# inviata, nessuna casella aperta. Nel registro pubblico solo conteggi.
on:
  schedule:
    - cron: '7 4 * * *'      # ogni notte, prima del controllo dei domini (5:37) e del primo invio (9:10 di Roma)
  workflow_dispatch:
    inputs:
      quali:
        description: 'coda (lettere da spedire), riserva (lettere spente), inviati (per la misura), tutti'
        default: 'tutti'
      minuti:
        description: 'Tempo massimo per le letture (minuti)'
        default: '50'
permissions:
  contents: read
concurrency: { group: caselle, cancel-in-progress: false }
jobs:
  caselle:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Repository privato (programmi, elenchi, invii)
        uses: actions/checkout@v4
        with:
          repository: drdonatistefano-cmyk/ristoranti-archivio
          token: ${{ secrets.PRIVATO_TOKEN }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /strumenti/
            /posta/
            /contatti/
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Prove dello strumento
        run: python3 strumenti/prove_caselle.py | tail -n 1
      - name: Siti, pagine e OpenStreetMap delle caselle
        env:
          QUALI: ${{ github.event.inputs.quali || 'tutti' }}
          MINUTI: ${{ github.event.inputs.minuti || '50' }}
        run: |
          q=$(echo "$QUALI" | tr -cd 'a-z'); case "$q" in coda|riserva|inviati|tutti) ;; *) q=tutti;; esac
          m=$(echo "$MINUTI" | tr -cd '0-9'); [ -z "$m" ] && m=50; [ "$m" -gt 60 ] && m=60
          python3 strumenti/caselle.py --segnali --quali "$q" --minuti "$m" 2>/dev/null | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g'
          python3 strumenti/caselle.py --coda 2>/dev/null | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g'
          mkdir -p /tmp/caselle && cp contatti/caselle/* /tmp/caselle/
      - name: Salva nel repository privato (solo la cartella contatti/caselle)
        run: |
          set +e
          git config user.name "ach-officina"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            # i sostituti già decisi a mano nel privato non si perdono: si tengono le righe di main che non sono «proposta»
            if [ -f contatti/caselle/sostituti.csv ]; then python3 - <<'P'
          import csv
          m = {r["vecchia"]: r for r in csv.DictReader(open("contatti/caselle/sostituti.csv", encoding="utf-8"))}
          n = list(csv.DictReader(open("/tmp/caselle/sostituti.csv", encoding="utf-8")))
          campi = list(n[0].keys()) if n else list(next(iter(m.values())).keys())
          for r in n:
              if r["vecchia"] in m and m[r["vecchia"]]["stato"] != "proposta":
                  r.update(m[r["vecchia"]])
          viste = {r["vecchia"] for r in n}
          n += [r for k, r in m.items() if k not in viste]
          w = csv.DictWriter(open("/tmp/caselle/sostituti.csv", "w", encoding="utf-8", newline=""), fieldnames=campi)
          w.writeheader(); w.writerows(n)
          P
            fi
            mkdir -p contatti/caselle && cp /tmp/caselle/* contatti/caselle/
            git add --sparse contatti/caselle
            git commit -qm "Affidabilità delle caselle (officina)" > /dev/null || { echo "invariata"; exit 0; }
            git push -q > /dev/null 2>&1 && { echo "salvata al tentativo $i"; exit 0; }
            sleep $((RANDOM % 15 + 5))
          done; echo "non salvata"; exit 1
      # 21/11/2026 (Stefano: «Procedi con i 5… diamogli un nome. Cobra»): Cobra (strumenti/cobra.py nel privato) è il
      # secondo controllo: riprende le caselle che il passo qui sopra non ha trovato sul sito e le cerca con la mappa del
      # sito, i dati strutturati, le email nascoste e un browser vero. Legge solo siti ufficiali (mai i social), rispetta
      # robots.txt, non raccoglie email nuove (REGOLE 2.7) e non mette nulla in coda. Salva solo contatti/cobra, unendo
      # i suoi risultati a quelli già su main. Se non riesce, il rifornimento qui sotto parte lo stesso. Qui solo conteggi.
      - name: Cobra, secondo controllo delle caselle sui siti
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set +e
          git config user.name "ach-officina"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main && git reset -q --hard origin/main
          [ -f strumenti/cobra.py ] || { echo "Cobra non c'è ancora nel privato"; exit 0; }
          python3 strumenti/prove_cobra.py > /tmp/prove-cobra.txt 2>&1 || { echo "prove di Cobra non riuscite: stanotte non gira"; exit 0; }
          tail -n 1 /tmp/prove-cobra.txt
          b=""; { python3 -m pip install --quiet playwright && python3 -m playwright install --with-deps chromium; } > /dev/null 2>&1 || b="--senza-browser"
          python3 strumenti/cobra.py --verifica --quali tutte --minuti 30 --fili 32 $b 2>/dev/null | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s#https?://[^ ]+#[link]#g'
          rm -rf /tmp/cobra; mkdir -p /tmp/cobra; cp contatti/cobra/* /tmp/cobra/ 2>/dev/null || { echo "niente da salvare"; exit 0; }
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 strumenti/cobra.py --unisci /tmp/cobra > /dev/null 2>&1
            git add --sparse contatti/cobra
            git commit -qm "Cobra: secondo controllo delle caselle sui siti (officina)" > /dev/null || { echo "invariato"; exit 0; }
            git push -q > /dev/null 2>&1 && { echo "salvato al tentativo $i"; exit 0; }
            sleep $((RANDOM % 15 + 5))
          done; echo "non salvato"; exit 1
      # 21/11/2026 (Stefano: «le code siano sempre sufficienti… fai in modo che diventi una routine»): subito dopo i
      # controlli freschi delle caselle, strumenti/rifornimento.py porta le lettere spedibili ad almeno 7 giorni al limite
      # pieno con i lotti continui (P2-C, P2-EC, P3-1LC; testi già approvati), solo con caselle che passano tutti i
      # controlli. Nel registro pubblico solo conteggi. Salva solo i tre elenchi continui e contatti/rifornimento.json.
      - name: Rifornimento delle code
        run: |
          set +e
          git clone -q --depth 1 https://github.com/drdonatistefano-cmyk/achdinners.com /tmp/achdinners.com
          git config user.name "ach-officina"; git config user.email "actions@users.noreply.github.com"
          git sparse-checkout add /contatti/dinners-p2-continuo.csv /contatti/dinners-p2e-continuo.csv /contatti/places-gestori-continuo.csv /contatti/rifornimento.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 strumenti/rifornimento.py --dinners /tmp/achdinners.com 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g'
            git add --sparse contatti/dinners-p2-continuo.csv contatti/dinners-p2e-continuo.csv contatti/places-gestori-continuo.csv contatti/rifornimento.json
            git commit -qm "Rifornimento delle code (officina)" > /dev/null || { echo "niente da aggiungere"; exit 0; }
            git push -q > /dev/null 2>&1 && { echo "salvato al tentativo $i"; exit 0; }
            sleep $((RANDOM % 15 + 5))
          done; echo "non salvato"; exit 1
